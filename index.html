function submit() {
  var birthDate = document.getElementById('birthDate').value;
  var gender = document.querySelector('input[name="gender"]:checked');
  if (!gender) gender = document.querySelector('input[name="gender"]');
  
  if (!birthDate) {
    alert(t('pleaseFillBirthday'));
    return;
  }
  
  var birth = new Date(birthDate);
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  
  if (birth > today) {
    var msg = LANG === 'EN' ?
      'Birth date cannot be in the future!' :
      LANG === 'TC' ?
      '出生日期不能是未來日期！' :
      '出生日期不能是未来日期！';
    alert(msg);
    return;
  }
  
  var age = calculateAge(birthDate);
  var special = getSpecialConditions();
  
  if (!validateAgeAndSpecial(age, special, gender ? gender.value : '男')) {
    return;
  }
  
  var parts = birthDate.split('-');
  var y = parseInt(parts[0]);
  var m = parseInt(parts[1]);
  var d = parseInt(parts[2]);
  
  var birthTimeEl = document.getElementById('birthTime');
  var birthTime = birthTimeEl ? birthTimeEl.value : '';
  var hr = null;
  if (birthTime) {
    var tp = birthTime.split(':');
    hr = parseInt(tp[0]) + parseInt(tp[1]) / 60;
  }
  
  var calendarEl = document.getElementById('calendar');
  var calendar = calendarEl ? calendarEl.value : 'solar';
  
  var birthPlaceEl = document.getElementById('birthPlace');
  var symptomEl = document.getElementById('symptom');
  var consultDateEl = document.getElementById('consultDate');
  var consultCalendarEl = document.getElementById('consultCalendar');
  
  var inp = {
    y: y,
    m: m,
    d: d,
    hr: hr,
    gn: gender ? gender.value : '男',
    ct: calendar,
    birthPlace: birthPlaceEl ? birthPlaceEl.value : '',
    livingPlaces: getTags('livingPlaceTags'),
    work: getTags('workTags'),
    special: getSpecialConditions(),
    symptom: symptomEl ? symptomEl.value : '',
    consultDate: consultDateEl ? consultDateEl.value : '',
    consultCalendar: consultCalendarEl ? consultCalendarEl.value : 'solar'
  };
  
  saveInput(inp);
  
  var inputForm = document.getElementById('inputForm');
  var header = document.getElementById('header');
  var loading = document.getElementById('loading');
  var report = document.getElementById('report');
  
  if (inputForm) inputForm.style.display = 'none';
  if (header) header.style.display = 'none';
  if (loading) loading.style.display = 'block';
  if (report) report.style.display = 'none';
  
  setTimeout(function() {
    try {
      // 获取保存的问卷结果
      try {
        inp.questionnaireResults = AppStorage.getQuestionnaire();
      } catch(e) {}
      var a = analyze(inp);
      lastResult = a;
      lastInput = inp;
      window._lastInp = inp;
      window._lastResult = a;
      if (loading) loading.style.display = 'none';
      if (report) {
        if (a && a.ok) {
          report.innerHTML = R(a, inp);
        } else {
          report.innerHTML = '<div class="error"><p>' + t('analysisFailed') + ': ' + esc(a.err || t('unknown')) + '</p></div>';
        }
        report.style.display = 'block';
      }
      bindReportLangSwitch();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      if (loading) loading.style.display = 'none';
      if (report) {
        report.innerHTML = '<div class="error"><p>' + esc(e.message) + '</p></div>';
        report.style.display = 'block';
      }
    }
  }, 500);
}

function bindReportLangSwitch() {
  var btns = document.querySelectorAll('#report .lang-btn');
  btns.forEach(function(btn) {
    btn.onclick = function() {
      setLang(this.getAttribute('data-lang'));
    };
  });
  startEncouragementRotation();
}

var encouragementInterval = null;
function startEncouragementRotation() {
  if (encouragementInterval) {
    clearInterval(encouragementInterval);
  }
  var el = document.querySelector('.encouragement-text');
  if (!el) return;
  var quotesStr = el.getAttribute('data-quotes');
  if (!quotesStr) return;
  try {
    var quotes = JSON.parse(quotesStr);
    if (!quotes || !quotes.length) return;
    var idx = 0;
    encouragementInterval = setInterval(function() {
      idx = (idx + 1) % quotes.length;
      el.style.opacity = 0;
      setTimeout(function() {
        el.textContent = quotes[idx];
        el.style.opacity = 1;
      }, 300);
    }, 5000);
  } catch (e) {}
}

function getTags(containerId) {
  var tags = [];
  var container = document.getElementById(containerId);
  if (!container) return tags;
  container.querySelectorAll('.tag').forEach(function(tag) {
    tags.push(tag.textContent.replace('×', '').trim());
  });
  return tags;
}

function getSpecialConditions() {
  var conditions = [];
  document.querySelectorAll('input[name="special"]:checked').forEach(function(cb) {
    var val = cb.value;
    if (val === t('other')) {
      var otherInput = document.getElementById('otherInput');
      var otherText = otherInput ? otherInput.value.trim() : '';
      if (otherText) {
        var translated = c2e(otherText);
        if (translated === otherText && /[\u4e00-\u9fa5]/.test(otherText)) {
          translated = toPinyin(otherText) + '(Pinyin)';
        }
        conditions.push(t('other') + ': ' + translated);
      } else {
        conditions.push(t('other'));
      }
    } else if (val === t('chronicDisease')) {
      var select = document.getElementById('chronicDiseaseSelect');
      var input = document.getElementById('chronicDiseaseInput');
      var chronicText = '';
      var enText = '';
      if (select && select.value && select.value !== '其他' && select.selectedIndex > 0) {
        chronicText = select.value;
        var selectedOpt = select.options[select.selectedIndex];
        enText = selectedOpt ? selectedOpt.getAttribute('data-en') || '' : '';
      } else if (input && input.value.trim()) {
        chronicText = input.value.trim();
      }
      if (chronicText) {
        var translated = '';
        if (LANG === 'EN') {
          if (enText) {
            translated = enText;
          } else {
            translated = c2e(chronicText);
            if (translated === chronicText && /[\u4e00-\u9fa5]/.test(chronicText)) {
              translated = toPinyin(chronicText) + '(Pinyin)';
            }
          }
        } else {
          translated = chronicText;
        }
        conditions.push(t('chronicDisease') + ': ' + translated);
      } else {
        conditions.push(t('chronicDisease'));
      }
    } else {
      conditions.push(val);
    }
  });
  return conditions;
}

function saveInput(inp) {

function loadSavedInput() {
  try {
    var saved = localStorage.getItem('lastInput');
    if (!saved) return;
    var s = JSON.parse(saved);
    
    if (s.y && s.m && s.d) {
      var bd = s.y + '-' + String(s.m).padStart(2, '0') + '-' + String(s.d).padStart(2, '0');
      var bdEl = document.getElementById('birthDate');
      if (bdEl) bdEl.value = bd;
    }
    
    if (s.gn) {
      var genderRadio = document.querySelector('input[name="gender"][value="' + s.gn + '"]');
      if (genderRadio) genderRadio.checked = true;
    }
    
    if (s.hr !== null && s.hr !== undefined) {
      var hours = Math.floor(s.hr);
      var mins = Math.round((s.hr - hours) * 60);
      var btEl = document.getElementById('birthTime');
      if (btEl) btEl.value = String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0');
    }
    
    if (s.consultDate) {
      var cdEl = document.getElementById('consultDate');
      if (cdEl) cdEl.value = s.consultDate;
    }
    
    if (s.consultCalendar) {
      var ccEl = document.getElementById('consultCalendar');
      if (ccEl) ccEl.value = s.consultCalendar;
    }
    
    if (s.ct) {
      var calEl = document.getElementById('calendar');
      if (calEl) calEl.value = s.ct;
    }
    
    var bpEl = document.getElementById('birthPlace');
    var syEl = document.getElementById('symptom');
    if (bpEl && s.birthPlace) bpEl.value = s.birthPlace;
    if (syEl && s.symptom) syEl.value = s.symptom;
    
    if (s.livingPlaces && s.livingPlaces.length) {
      var container = document.getElementById('livingPlaceTags');
      if (container) s.livingPlaces.forEach(function(p) { addTag(container, p); });
    }
    
    if (s.work && s.work.length) {
      var container = document.getElementById('workTags');
      if (container) s.work.forEach(function(w) { addTag(container, w); });
    }
    
    if (s.special && s.special.length) {
      s.special.forEach(function(sp) {
        if (sp.startsWith('其他: ')) {
          var ocEl = document.getElementById('otherCheckbox');
          var oiEl = document.getElementById('otherInput');
          if (ocEl) ocEl.checked = true;
          if (oiEl) {
            oiEl.value = sp.replace('其他: ', '');
            oiEl.style.display = 'inline-block';
          }
        } else {
          var cb = document.querySelector('input[name="special"][value="' + sp + '"]');
          if (cb) cb.checked = true;
        }
      });
    }
  } catch (e) {}
  
  // 恢复问卷结果
  try {
    var savedQ = AppStorage.getQuestionnaire();
    
    if (savedQ) {
      // 显示问卷已完成的提示
      var btn = document.getElementById('questionnaireSubmitBtn');
      if (btn) {
        btn.textContent = '✓ ' + t('submitted');
        btn.disabled = true;
      }
      
      // 恢复问卷选择状态
      if (savedQ.questionnaireData && savedQ.questionnaireData.answers) {
        questionnaireAnswers = savedQ.questionnaireData.answers;
      }
    }
  } catch (e) {}
}

function restoreQuestionnaireSelection() {
  var container = document.getElementById('questionsArea');
  if (!container) return;
  
  for (var qid in questionnaireAnswers) {
    if (!questionnaireAnswers.hasOwnProperty(qid)) continue;
    var score = questionnaireAnswers[qid];
    var opt = container.querySelector('.q-opt[data-qid="' + qid + '"][data-score="' + score + '"]');
    if (opt) {
      opt.classList.add('selected');
    }
  }
}

function setDefaultDate() {
  var now = new Date();
  var bd = document.getElementById('birthDate');
  if (bd && !bd.value) {
    bd.value = now.getFullYear() + '-01-01';
  }
}

function setDefaultConsultDate() {
  var now = new Date();
  var cd = document.getElementById('consultDate');
  if (cd && !cd.value) {
    var today = now.getFullYear() + '-' + 
      String(now.getMonth() + 1).padStart(2, '0') + '-' + 
      String(now.getDate()).padStart(2, '0');
    cd.value = today;
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function calculateAge(birthDate) {
  var today = new Date();
  var birth = new Date(birthDate);
  var age = today.getFullYear() - birth.getFullYear();
  var monthDiff = today.getMonth() - birth.getMonth();
  if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
    age--;
  }
  return age;
}

function validateAgeAndSpecial(age, special, gender) {
  if (special.indexOf('退休') >= 0 && age < 45) {
    var msg = LANG === 'EN' ? 
      'You selected "Retired" but your age is ' + age + '. Please confirm.' :
      LANG === 'TC' ?
      '您選擇了"退休"，但年齡為' + age + '歲，請確認是否正確。' :
      '您选择了"退休"，但年龄为' + age + '岁，请确认是否正确。';
    if (!confirm(msg)) return false;
  }
  
  if (special.indexOf('孕期/备孕') >= 0) {
    if (age < 15 || age > 55) {
      var msg = LANG === 'EN' ?
        'You selected "Pregnancy/Planning" but your age is ' + age + '. Please confirm.' :
        LANG === 'TC' ?
        '您選擇了"孕期/備孕"，但年齡為' + age + '歲，請確認是否正確。' :
        '您选择了"孕期/备孕"，但年龄为' + age + '岁，请确认是否正确。';
      if (!confirm(msg)) return false;
    }
  }
  
  if (special.indexOf('学生') >= 0 && age > 40) {
    var msg = LANG === 'EN' ?
      'You selected "Student" but your age is ' + age + '. Please confirm.' :
      LANG === 'TC' ?
      '您選擇了"學生"，但年齡為' + age + '歲，請確認是否正確。' :
        '您选择了"学生"，但年龄为' + age + '岁，请确认是否正确。';
    if (!confirm(msg)) return false;
  }
  
  return true;
}

// ===== 中医体质问卷功能 =====

var questionnaireAnswers = {};

function getQText(key) {
  return I18N[LANG][key] || key;
}

function initQuestionnaire() {
  if (typeof TizhiQuestionnaire === 'undefined') return;
  
  var container = document.getElementById('questionsArea');
  if (!container) return;
  
  var Q = TizhiQuestionnaire.data;
  var html = '';
  
  for (var i = 0; i < Q.typeOrder.length; i++) {
    var typeKey = Q.typeOrder[i];
    var type = Q.types[typeKey];
    
    html += '<div class="q-type-group">';
    html += '<div class="q-type-header">';
    html += '<div class="q-type-icon">' + type.icon + '</div>';
    html += '<div class="q-type-name">' + getQText(type.nameKey) + '</div>';
    html += '</div>';
    
    for (var j = 0; j < type.items.length; j++) {
      var item = type.items[j];
      html += '<div class="q-item" data-qid="' + item.id + '" data-type="' + typeKey + '">';
      html += '<div class="q-text">' + getQText(item.textKey);
      if (item.reverse) {
        html += '<span class="q-reverse-tag" title="' + t('qReverseNote') + '">*</span>';
      }
      html += '</div>';
      html += '<div class="q-options">';
      for (var k = 1; k <= 5; k++) {
        html += '<div class="q-opt" data-score="' + k + '" data-qid="' + item.id + '">' + k + '</div>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  }
  
  // 先清除旧内容再渲染
  container.innerHTML = html;
  
  // 绑定选项点击事件（先清除旧监听器）
  var newContainer = container.cloneNode(true);
  container.parentNode.replaceChild(newContainer, container);
  newContainer.id = 'questionsArea';
  
  newContainer.addEventListener('click', function(e) {
    var opt = e.target.closest('.q-opt');
    if (!opt) return;
    
    var qid = opt.getAttribute('data-qid');
    var score = parseInt(opt.getAttribute('data-score'));
    
    // 移除同题其他选项的选中状态
    var siblings = newContainer.querySelectorAll('.q-opt[data-qid="' + qid + '"]');
    for (var i = 0; i < siblings.length; i++) {
      siblings[i].classList.remove('selected');
    }
    
    // 选中当前选项
    opt.classList.add('selected');
    questionnaireAnswers[qid] = score;
  });
  
  // 绑定提交按钮
  var submitBtn = document.getElementById('questionnaireSubmitBtn');
  if (submitBtn) {
    submitBtn.onclick = submitQuestionnaire;
    submitBtn.disabled = false;
    submitBtn.textContent = t('submitQuestionnaire');
  }
}

function submitQuestionnaire() {
  if (typeof TizhiQuestionnaire === 'undefined') return;
  
  var unfilled = [];
  for (var qid in questionnaireAnswers) {
    if (questionnaireAnswers.hasOwnProperty(qid)) unfilled++;
  }
  
  if (unfilled < 27) {
    var left = 27 - unfilled;
    showToast(t('qNotAllAnswered').replace('{n}', left), 'warning');
    return;
  }
  
  var results = TizhiQuestionnaire.calcAllTypes(questionnaireAnswers);
    
    // 构建保存数据：包含答案和结果
    var saveData = {
      questionnaireData: {
        answers: {}
      },
      timestamp: new Date().toISOString()
    };
    for (var qid in questionnaireAnswers) {
      if (questionnaireAnswers.hasOwnProperty(qid)) {
        saveData.questionnaireData.answers[qid] = questionnaireAnswers[qid];
      }
    }
    for (var key in results) {
      if (results.hasOwnProperty(key) && key !== 'questionnaireData') {
        saveData[key] = results[key];
      }
    }
    lastQuestionnaireResults = saveData;
    results = saveData;  // 用于显示
    
    // 保存结果
  try {
    if (typeof AppStorage !== 'undefined') {
      AppStorage.saveQuestionnaire(lastQuestionnaireResults);
    } else {
      localStorage.setItem('healthy_questionnaire', JSON.stringify(lastQuestionnaireResults));
    }
  } catch(e) {
    // 静默处理保存失败
  }
  
  // 显示结果
  showQuestionnaireResults(lastQuestionnaireResults);
  
  // 更新提交按钮
  var submitBtn = document.getElementById('questionnaireSubmitBtn');
  if (submitBtn) {
    submitBtn.textContent = '✓ ' + t('submitted');
    submitBtn.disabled = true;
  }
  
  showToast(t('qSubmitted'), 'success');
}

function showQuestionnaireResults(results) {
  var questionsArea = document.getElementById('questionsArea');
  var resultsDiv = document.getElementById('questionnaireResults');
  var submitBtn = document.getElementById('questionnaireSubmitBtn');
  
  if (!resultsDiv) return;
  
  var html = '<div class="q-result-section">';
  html += '<h2 style="text-align:center;margin-bottom:16px;">' + t('qResultTitle') + '</h2>';
  
  // 显示平和质判定
  if (results.pingheJudgment) {
    html += '<div class="q-result-card';
    if (results.pingheJudgment.status === 'pinghe' || results.pingheJudgment.status === 'basic_pinghe') {
      html += ' q-result-main';
    }
    html += '">';
    html += '<div class="q-result-header">';
    html += '<div class="q-result-name">' + getQText('qTypeBalancedConstitution') + '</div>';
    html += '<div class="q-result-score">' + results.balancedConstitution.transformedScore + '</div>';
    html += '</div>';
    html += '<div class="q-result-bar"><div class="q-result-bar-fill" style="width:' + results.balancedConstitution.transformedScore + '%;background:var(--green)"></div></div>';
    html += '<div class="q-result-judge">' + results.pingheJudgment.label + '</div>';
    html += '</div>';
  }
  
  // 显示其他体质
  for (var i = 1; i < TizhiQuestionnaire.data.typeOrder.length; i++) {
    var key = TizhiQuestionnaire.data.typeOrder[i];
    var r = results[key];
    
    html += '<div class="q-result-card';
    if (r.judgment.isYes) {
      html += ' q-result-main';
    }
    html += '">';
    html += '<div class="q-result-header">';
    html += '<div class="q-result-name">' + getQText(r.nameKey) + '</div>';
    html += '<div class="q-result-score">' + r.transformedScore + '</div>';
    html += '</div>';
    html += '<div class="q-result-bar"><div class="q-result-bar-fill" style="width:' + r.transformedScore + '%;background:' + getBarColor(r.transformedScore) + '"></div></div>';
    html += '<div class="q-result-judge">' + r.judgment.label + '</div>';
    
    html += '</div>';
  }
  
  // 显示主要体质和复合体质
  if (results.mainType) {
    html += '<div style="text-align:center;margin-top:16px;padding:12px;background:rgba(255,214,10,0.15);border-radius:8px;">';
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">' + t('qMainType') + '</div>';
    html += '<div style="font-size:18px;font-weight:600;color:var(--gold);">' + getQText(results.mainType.nameKey) + ' (' + results.mainType.score + ')</div>';
    html += '</div>';
  }
  
  if (results.complexTypes && results.complexTypes.length > 0) {
    html += '<div style="text-align:center;margin-top:8px;padding:12px;background:rgba(255,69,58,0.1);border-radius:8px;">';
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">' + t('qComplexTypes') + '</div>';
    html += '<div style="font-size:16px;">';
    for (var i = 0; i < results.complexTypes.length; i++) {
      html += getQText(results.complexTypes[i].nameKey) + ' (' + results.complexTypes[i].score + ')';
      if (i < results.complexTypes.length - 1) html += ' + ';
    }
    html += '</div></div>';
  }
  
  html += '</div>';
  
  // 隐藏问题区，显示结果区
  if (questionsArea) questionsArea.style.display = 'none';
  resultsDiv.innerHTML = html;
  resultsDiv.style.display = 'block';
  
  // 更新按钮状态：禁用提交按钮，显示重新填写按钮
  if (submitBtn) {
    submitBtn.textContent = '✓ ' + t('submitted');
    submitBtn.disabled = true;
  }
  
  // 滚动到结果
  resultsDiv.scrollIntoView({ behavior: 'smooth' });
}

function getBarColor(score) {
  if (score >= 60) return 'var(--red)';
  if (score >= 40) return 'var(--gold)';
  if (score >= 30) return 'var(--primary)';
  return 'var(--green)';
}

function showToast(msg, type) {
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'success');
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
  }, 2000);
}

function retakeQuestionnaire() {
  // 清除问卷回答
  questionnaireAnswers = {};
  lastQuestionnaireResults = null;
  
  // 清除存储
  try {
    if (typeof AppStorage !== 'undefined') {
      AppStorage.clearQuestionnaire();
    } else {
      localStorage.removeItem('healthy_questionnaire');
    }
  } catch(e) {}
  
  // 恢复UI
  var questionsArea = document.getElementById('questionsArea');
  var resultsDiv = document.getElementById('questionnaireResults');
  var submitBtn = document.getElementById('questionnaireSubmitBtn');
  var retakeBtn = document.getElementById('questionnaireRetakeBtn');
  
  if (questionsArea) questionsArea.style.display = 'block';
  if (resultsDiv) { resultsDiv.innerHTML = ''; resultsDiv.style.display = 'none'; }
  if (submitBtn) { submitBtn.textContent = t('submitQuestionnaire'); submitBtn.disabled = false; }
  
  // 重新渲染问卷
  initQuestionnaire();
}

function initQuestionnaireToggle() {
  var btn = document.getElementById('questionnaireToggleBtn');
  var container = document.getElementById('questionnaireContainer');
  if (!btn || !container) return;
  
  btn.addEventListener('click', function() {
    var isHidden = container.style.display === 'none' || container.style.display === '';
    container.style.display = isHidden ? 'block' : 'none';
    
    var arrow = btn.querySelector('.expand-icon');
    if (arrow) arrow.textContent = isHidden ? '▼' : '▶';
    
    if (isHidden) {
      // 检查是否有保存的问卷结果
      try {
        var savedQ = AppStorage.getQuestionnaire();
      } catch(e) { savedQ = null; }
      
      if (savedQ && savedQ.questionnaireData && savedQ.questionnaireData.answers) {
        questionnaireAnswers = savedQ.questionnaireData.answers;
        // 显示结果
        setTimeout(function() {
          showQuestionnaireResults(savedQ);
          var submitBtn = document.getElementById('questionnaireSubmitBtn');
          if (submitBtn) {
            submitBtn.textContent = '✓ ' + t('submitted');
            submitBtn.disabled = true;
          }
        }, 50);
      } else {
        // 初始化问题
        setTimeout(function() {
          var questionsArea = document.getElementById('questionsArea');
          var resultsDiv = document.getElementById('questionnaireResults');
          if (questionsArea) questionsArea.style.display = 'block';
          if (resultsDiv) resultsDiv.style.display = 'none';
          initQuestionnaire();
        }, 50);
      }
      
      container.scrollIntoView({ behavior: 'smooth' });
    }
  });
}
