<meta charset="UTF-8">

<title>生活助手</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080f;--card:#111119;--border:#252535;--text:#d8d8e0;--dim:#777;
  --gold:#c9a46c;--red:#e04040;--green:#3dba5c;--blue:#4a8fd4;
  --wood:#3dba5c;--fire:#e04040;--earth:#c9a46c;--metal:#a8a8b8;--water:#4a8fd4;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;
}
.wrap{max-width:940px;margin:0 auto;padding:16px}
.header{text-align:center;padding:48px 16px 32px}
.header h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:300;letter-spacing:.15em;color:var(--gold);margin-bottom:8px}
.header p{color:var(--dim);font-size:.85rem;letter-spacing:.05em}
.header .sub{margin-top:4px;font-size:.78rem;color:#555}
.form{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 24px;margin-bottom:20px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fr.full{grid-template-columns:1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.82rem;color:var(--dim);font-weight:500}
.fg input,.fg select,.fg textarea{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:8px;font-size:.95rem;resize:vertical;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gold)}
.fg .hint{font-size:.72rem;color:#555;margin-top:2px}
.rr{display:flex;gap:4px;margin:8px 0 12px}
.rr label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.9rem;padding:6px 16px;border-radius:8px;border:1px solid var(--border);transition:all .2s}
.rr label:has(input:checked){background:rgba(201,164,108,0.15);border-color:var(--gold);color:var(--gold);font-weight:600}
.rr input[type=radio]{accent-color:var(--gold);width:16px;height:16px}
.btn{
  display:block;width:100%;padding:14px;
  background:linear-gradient(135deg,var(--gold),#a07840);
  color:#0a0a0a;border:none;border-radius:10px;
  font-size:1.05rem;font-weight:600;cursor:pointer;letter-spacing:.08em;margin-top:8px;
}
.btn:hover{opacity:.92}
.sum{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:20px}
.sum h2{font-size:1rem;font-weight:400;color:var(--gold);margin-bottom:10px;letter-spacing:.1em}
.sg{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.9rem}
.sg .k{color:var(--dim)}.sg .v{font-weight:500}.sg .gd{color:var(--gold)}
.sec{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.sec h2{font-size:1.05rem;color:var(--gold);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);letter-spacing:.08em}
.row{display:flex;gap:16px;margin-bottom:16px}
.row .sec{flex:1;margin-bottom:0}
@media(max-width:700px){.row{flex-direction:column}}
.it{padding:5px 0 5px 14px;border-left:3px solid var(--border);margin:3px 0;font-size:.88rem;line-height:1.65}
.io{border-color:var(--green);color:#b8e8c8}
.ib{border-color:var(--red);color:#f0a0a0}
.ii{border-color:var(--blue);color:#a0c8e8}
.ig{border-color:var(--gold);color:var(--gold)}
.sub{font-size:.9rem;color:var(--gold);font-weight:500;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.rf{background:linear-gradient(135deg,#2a0000,#1a0000);border-color:var(--red);animation:pu 1.5s infinite}
@keyframes pu{0%,100%{border-color:var(--red)}50%{border-color:#ff4040}}
.rf h2{color:var(--red)!important}
.wb{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:8px 0;gap:2px}
.wb>div{flex:1;border-radius:3px}
.WK{display:flex;gap:8px;margin:8px 0;font-size:.85rem}
.WK>span{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,0.05)}
.WK .w1{color:#3dba5c}.WK .w2{color:#e04040}.WK .w3{color:#c9a46c}.WK .w4{color:#a8a8b8}.WK .w5{color:#4a8fd4}
.dis{background:#1a1a25;border:1px solid #333;border-radius:12px;padding:16px;color:#888;font-size:.85rem;line-height:1.8;margin-top:20px}
.dis strong{color:#c9a46c}
.lang-switch{position:absolute;top:12px;right:16px;display:flex;gap:6px;z-index:10}
.lang-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;transition:all 0.2s}
.lang-btn:hover{background:rgba(255,255,255,0.15);color:var(--text)}
.lang-btn.active{background:rgba(218,165,32,0.2);border-color:var(--gold);color:var(--gold);font-weight:bold}
</style>
</head>

    <div class="fg"><label data-i18n="birthMonth">出生月份</label><input type="number" id="iM" value="1" min="1" max="12"></div>
  </div>
  <div class="fr">
    <div class="fg"><label data-i18n="birthDay">出生日期</label><input type="number" id="iD" value="15" min="1" max="31"></div>

  </div>
  <div class="fr">
    <div class="fg"><label data-i18n="gender">性别</label><select id="iG"><option value="男">男</option><option value="女">女</option></select></div>
    <div class="fg"><label data-i18n="zodiac">星座(可选)</label><select id="iS"><option value="">自动计算</option><option>白羊座</option><option>金牛座</option><option>双子座</option><option>巨蟹座</option><option>狮子座</option><option>处女座</option><option>天秤座</option><option>天蝎座</option><option>射手座</option><option>摩羯座</option><option>水瓶座</option><option>双鱼座</option></select></div>
  </div>
  <div class="rr">
    <label><input type="radio" name="ct" value="solar" checked> <span data-i18n="solar">阳历</span></label>
    <label><input type="radio" name="ct" value="lunar"> <span data-i18n="lunar">农历</span></label>
  </div>
  <div id="lpR" style="display:none">
    <div class="fg"><label data-i18n="leapMonth">闰月</label><select id="iL"><option value="0">否</option><option value="1">是</option></select></div>
  </div>
  <div class="fr">
    <div class="fg"><label data-i18n="consultDate">咨询日期</label><input type="date" id="iCD"></div>
    <div class="fg"><label data-i18n="consultTime">咨询时间</label><input type="time" id="iCT"></div>
  </div>
  <div class="fr full">
    <div class="fg"><label data-i18n="tongue">舌象(可选)</label><textarea id="iTongue" rows="2" placeholder="如：舌红苔黄厚腻、舌淡胖有齿痕"></textarea></div>
  </div>
  <div class="fr full">
    <div class="fg"><label data-i18n="pulse">脉象(可选)</label><textarea id="iPulse" rows="2" placeholder="如：弦数、滑、细弱"></textarea></div>
  </div>
  <div class="fr full">
    <div class="fg"><label data-i18n="symptom">🩺 当前不适症状（可选，胸痛/呼吸困难等急症请直接拨打120！）</label><input type="text" id="symptom" placeholder="如：咳嗽、失眠、胸闷、胃痛…"></div>
  </div>
  <button class="btn" onclick="go()">开始分析</button>
</div>
</div>

<div id="empty" style="display:none">
  <div class="sec"><p class="it ii">请填写出生信息并点击"开始分析"</p></div>
</div>

<div id="loading" style="display:none">
  <div class="sec"><p class="it io">正在分析...</p></div>
</div>

<div id="report"></div>
</div>

    var newResult=analyze(lastInput);
    if(newResult.ok){
      lastResult=newResult;
      var reportEl=document.getElementById('report');
      if(reportEl) reportEl.innerHTML=R(lastResult,lastInput);
    }
  }
}

  var i=(m===3&&d>=21)||(m===4&&d<=19)?0:(m===4&&d>=20)||(m===5&&d<=20)?1:(m===5&&d>=21)||(m===6&&d<=21)?2:(m===6&&d>=22)||(m===7&&d<=22)?3:(m===7&&d>=23)||(m===8&&d<=22)?4:(m===8&&d>=23)||(m===9&&d<=22)?5:(m===9&&d>=23)||(m===10&&d<=23)?6:(m===10&&d>=24)||(m===11&&d<=22)?7:(m===11&&d>=23)||(m===12&&d<=21)?8:(m===12&&d>=22)||(m===1&&d<=19)?9:(m===1&&d>=20)||(m===2&&d<=18)?10:11;
  return zCn[i]||'双鱼座';
}
function ygz(y){return{g:TG[(y-4)%10],z:DZ[(y-4)%12]};}
function mgz(gt,mo){var mz=MZM[mo]||'寅';var b=(TG.indexOf(gt)%5)*2+2;var o=(DZ.indexOf(mz)-2)%12;return{g:TG[(b+o)%10],z:mz};}
function dgz(y,m,d){
  try{
    if(isNaN(y)||isNaN(m)||isNaN(d))return{g:'甲',z:'子'};
    var df=Math.floor((new Date(y,m-1,d).getTime()-new Date(1899,11,31).getTime())/86400000);
    if(isNaN(df))return{g:'甲',z:'子'};
    var i=((10+df)%60+600)%60;
    return{g:TG[i%10],z:DZ[i%12]};
  }catch(e){return{g:'甲',z:'子'};}
}
function hgz(dg,hr){var zi=hr===23?0:Math.floor((hr+1)/2);if(zi>=12)zi=0;var b=(TG.indexOf(dg)%5)*2;return{g:TG[(b+zi)%10],z:DZ[zi]};}
function getZw(hr){for(var i=0;i<JL.length;i++){var z=JL[i];if(z.s===23){if(hr===0||hr>=23)return z;}else{if(z.s<=hr&&hr<z.e)return z;}}return JL[0];}
function isYangGan(g){return['甲','丙','戊','庚','壬'].indexOf(g)>=0;}

function calcDayun(by, bm, gender, sy, sm, sd, hour, comparisonYear){
  var steps = [];
  var startAge = 3;
  var direction = '顺行';
  var compYear = comparisonYear || new Date().getFullYear();
  try{
    var solarObj = Solar.fromYmdHms(sy, sm, sd, hour||0, 0, 0);
    var lunarObj2 = solarObj.getLunar();
    var eightChar = lunarObj2.getEightChar();
    var genderCode = gender === '男' ? 0 : 1;
    var yun = eightChar.getYun(genderCode);
    startAge = yun.getStartYear();
    var startMonth = yun.getStartMonth();
    if(startMonth >= 6) startAge += 1;
    direction = yun.getForward ? '顺行' : '逆行';
    var daYunArr = yun.getDaYun();
    for(var i = 0; i < Math.min(daYunArr.length, 12); i++){
      var dy = daYunArr[i];
      var gz = dy.getGanZhi();
      var gan = gz.charAt(0);
      var zhi = gz.charAt(1);
      var wy = YU[gan] || '?';
      var lq = LQ[zhi] || '?';
      var start = startAge + i * 10;
      var end = startAge + (i + 1) * 10;
      var startYear = sy + start;
      var isCurrent = compYear >= startYear && compYear < (startYear + 10);
      steps.push({
        gz: {g:gan, z:zhi},
        wy: wy,
        lq: lq,
        ageRange: start+'-'+end+(LANG==='en'?'y':'岁'),
        yearRange: startYear+'-'+(startYear+9),
        startAge: start,
        isCurrent: isCurrent
      });
    }
  }catch(e){
    // fallback to original calculation
    var isYang = isYangGan(by.g);
    var isMale = gender === '男';
    var forward = (isYang && isMale) || (!isYang && !isMale);
    var currentMg = bm;
    for(var i=0;i<12;i++){
      var stepGan, stepZhi;
      if(forward){
        stepGan = TG[(TG.indexOf(currentMg.g) + i) % 10];
        stepZhi = DZ[(DZ.indexOf(currentMg.z) + i) % 12];
      }else{
        stepGan = TG[(TG.indexOf(currentMg.g) - i + 10) % 10];
        stepZhi = DZ[(DZ.indexOf(currentMg.z) - i + 12) % 12];
      }
      var wy = YU[stepGan] || '?';
      var lq = LQ[stepZhi] || '?';
      var start = Math.floor(startAge + i * 10);
      var end = Math.floor(startAge + (i+1) * 10);
      var startYear = sy + start;
      var isCurrent = compYear >= startYear && compYear < (startYear + 10);
      steps.push({
        gz: {g:stepGan, z:stepZhi},
        wy: wy,
        lq: lq,
        ageRange: start+'-'+end+(LANG==='en'?'y':'岁'),
        yearRange: startYear+'-'+(startYear+9),
        startAge: start,
        isCurrent: isCurrent
      });
    }
    direction = forward ? '顺行' : '逆行';
  }
  return {startAge: startAge, direction: direction, steps: steps};
}

function analyze(inp){
  try{
    if(typeof Lunar==='undefined') return {ok:false,err:LANG==='en'?'Lunar calendar engine not loaded':LANG==='tw'?'未加載萬年曆引擎':'未加载万年历引擎'};
    var sy=inp.y,sm=inp.m,sd=inp.d;
    var lunarObj, solarObj;
    if(inp.ct==='lunar'){
      try{
        lunarObj=Lunar.fromLunar(sy,sm,sd,inp.il);
      }catch(e){
        lunarObj=Lunar.fromYmdHms(sy,sm,sd,0,0,0);
      }
    }else{
      try{
        solarObj=Solar.fromYmd(sy,sm,sd);
        lunarObj=solarObj.getLunar();
      }catch(e){
        lunarObj=Lunar.fromYmdHms(sy,sm,sd,0,0,0);
      }
    }
    if(!lunarObj) return {ok:false,err:LANG==='en'?'Invalid lunar calendar input':LANG==='tw'?'農曆輸入無效':'农历输入无效'};
    var lunarYearNum = lunarObj.getYear?lunarObj.getYear():sy;
    var lunarMonth = lunarObj.getMonth?lunarObj.getMonth():'?';
    var lunarDay = lunarObj.getDay?lunarObj.getDay():'?';
    var lunarYearGanzhi = lunarObj.getYearInGanZhiExact?lunarObj.getYearInGanZhiExact():lunarObj.getYearInGanZhi?lunarObj.getYearInGanZhi():'甲子';
    var shengxiao = lunarObj.getYearShengXiaoExact?lunarObj.getYearShengXiaoExact():lunarObj.getYearShengXiao?lunarObj.getYearShengXiao():'鼠';
    var yearGan = lunarYearGanzhi.charAt(0);
    var yearZhi = lunarYearGanzhi.charAt(1);
    var lunarDisplay = (LANG==='en'?'Lunar ':LANG==='tw'?'農曆 ':'农历 ') + lunarYearNum + '-' + lunarMonth + '-' + lunarDay;
    var by = {g:yearGan||'甲', z:yearZhi||'子'};
    if(!by.g||!by.z)by={g:'甲',z:'子'};
    var bm = mgz(by.g, sm);
    var bd = dgz(sy, sm, sd);
    var bh = null;
    if(inp.hr!=null && inp.hr>=0 && inp.hr<=23 && bd.g) bh = hgz(bd.g, inp.hr);
    var ccy=inp.cy!=null?inp.cy:new Date().getFullYear();
    var ccm=inp.cm!=null?inp.cm:new Date().getMonth()+1;
    var ccd=inp.cd!=null?inp.cd:new Date().getDate();
    if(isNaN(ccy))ccy=2026; if(isNaN(ccm))ccm=1; if(isNaN(ccd))ccd=1;
    var dayun=calcDayun(by, bm, inp.gn, sy, sm, sd, ccy);
    var cchour=(inp.cminute!=null)?Math.floor(inp.cminute):(new Date().getHours());
    var cy=ygz(ccy);
    var cm=mgz(cy.g, ccm);
    var cd=dgz(ccy, ccm, ccd);
    if(!cd||!cd.g||!cd.z)cd={g:'甲',z:'子'};
    var ch=hgz(cd.g, cchour);
    var bYun=YU[by.g]||'?',bLq=LQ[by.z]||'?';
    var cYun=YU[cy.g]||'?',cLq=LQ[cy.z]||'?';
    // 纳音
    var bny = lunarObj.getYearNaYin?lunarObj.getYearNaYin():'?';
    var bmny = lunarObj.getMonthNaYin?lunarObj.getMonthNaYin():'?';
    var bdnay = lunarObj.getDayNaYin?lunarObj.getDayNaYin():'?';
    var btnay = lunarObj.getTimeNaYin?lunarObj.getTimeNaYin():'?';
    // 对比年纳音
    var cSolar = Solar.fromYmd(ccy, ccm, ccd);
    var cLunar = cSolar.getLunar();
    var cny = cLunar.getYearNaYin?cLunar.getYearNaYin():'?';
    var cmn = cLunar.getMonthNaYin?cLunar.getMonthNaYin():'?';
    var cdn = cLunar.getDayNaYin?cLunar.getDayNaYin():'?';
    var chn = cLunar.getTimeNaYin?cLunar.getTimeNaYin():'?';
    var bw=[GW[by.g],ZW[by.z],GW[bm.g],ZW[bm.z],GW[bd.g],ZW[bd.z]];
    if(bh)bw.push(GW[bh.g],ZW[bh.z]);
    var bwc={木:0,火:0,土:0,金:0,水:0};
    for(var i=0;i<bw.length;i++){var w=bw[i];if(bwc.hasOwnProperty(w))bwc[w]++;}
    var cw=[GW[cy.g],ZW[cy.z],GW[cm.g],ZW[cm.z],GW[cd.g],ZW[cd.z],GW[ch.g],ZW[ch.z]];
    var cwc={木:0,火:0,土:0,金:0,水:0};
    for(var i=0;i<cw.length;i++){var w=cw[i];if(cwc.hasOwnProperty(w))cwc[w]++;}
    var wc={木:0,火:0,土:0,金:0,水:0};
    for(var i=0;i<WK.length;i++){wc[WK[i]]=(bwc[WK[i]]||0)+(cwc[WK[i]]||0);}
    var maxW=0,minW=999;
    for(var i=0;i<WK.length;i++){if(wc[WK[i]]>maxW)maxW=wc[WK[i]];if(wc[WK[i]]<minW)minW=wc[WK[i]];}
    var miss=[],abun=[];
    for(var i=0;i<WK.length;i++){if(wc[WK[i]]<=minW)miss.push(WK[i]);if(wc[WK[i]]>=maxW)abun.push(WK[i]);}
    var ht=(wc['火']||0)/(wc['火']||0 + wc['水']||0 + 1);
    var cld=(wc['水']||0)/(wc['水']||0 + wc['火']||0 + 1);
    var dp=(wc['土']||0)/(wc['土']||0 + wc['木']||0 + 1);
    var worg=[],zvuln=[];
    if(wc['火']>wc['水']+1)worg.push('心');
    if(wc['水']>wc['火']+1)worg.push('肾');
    if(wc['木']>wc['土']+1)worg.push('肝');
    if(wc['土']>wc['木']+1)worg.push('脾');
    if(wc['金']>wc['火']+1)worg.push('肺');
    var zw=getZw(cchour);
    var zc=inp.si||zodiac(sm,sd);
    var diag='',warns=[];
    if(ht>=0.7)warns.push(LANG==='en'?'Excess Heart Fire':LANG==='tw'?'心火過旺':'心火过旺');
    if(cld>=0.7)warns.push(LANG==='en'?'Excess Cold in Kidney Water':LANG==='tw'?'腎水過寒':'肾水过寒');
    if(dp>=0.7)warns.push(LANG==='en'?'Internal Damp-Turbidity':LANG==='tw'?'濁濕內蘊':'湿浊内蕴');
    if(ht>=0.6&&cld>=0.6)diag=LANG==='en'?'Cold-Heat Complex':LANG==='tw'?'寒熱錯雜':'寒热错杂';
    else if(ht>=0.6)diag=LANG==='en'?'Heat Constitution':LANG==='tw'?'偏熱體質':'偏热体质';
    else if(cld>=0.6)diag=LANG==='en'?'Cold Constitution':LANG==='tw'?'偏寒體質':'偏寒体质';
    else diag=LANG==='en'?'Balanced Constitution':LANG==='tw'?'平和體質':'平和体质';
    var mn=((new Date(ccy,ccm-1,ccd).getTime()-new Date(2000,0,6).getTime())/86400000) % 29.53;
    mn=(mn+29.53)%29.53;
    var mr='';
    if(mn<3.66)mr=LANG==='en'?'New Moon':LANG==='tw'?'朔月':'朔月';
    else if(mn<7.38)mr=LANG==='en'?'Waxing Crescent':LANG==='tw'?'娥眉月':'娥眉月';
    else if(mn<11.1)mr=LANG==='en'?'First Quarter':LANG==='tw'?'上弦月':'上弦月';
    else if(mn<14.77)mr=LANG==='en'?'Waxing Gibbous':LANG==='tw'?'盈凸月':'盈凸月';
    else if(mn<18.45)mr=LANG==='en'?'Full Moon':LANG==='tw'?'望月':'望月';
    else if(mn<22.12)mr=LANG==='en'?'Waning Gibbous':LANG==='tw'?'虧凸月':'亏凸月';
    else if(mn<25.84)mr=LANG==='en'?'Last Quarter':LANG==='tw'?'下弦月':'下弦月';
    else mr=LANG==='en'?'Waning Crescent':LANG==='tw'?'殘月':'残月';
    var tongueAnalysis='';
    if(inp.tongue){
      var t=inp.tongue;
      if(t.indexOf('\u7EA2')>=0)tongueAnalysis+=(LANG==='en'?' Red Tongue-Heat Pattern':LANG==='tw'?' 舌紅-熱證':' 舌红-热证');
      if(t.indexOf('\u6DE1')>=0)tongueAnalysis+=(LANG==='en'?' Pale Tongue-Deficiency Cold':LANG==='tw'?' 舌淡-虛寒':' 舌淡-虚寒');
      if(t.indexOf('\u6697')>=0)tongueAnalysis+=(LANG==='en'?' Dark Tongue-Blood Stasis':LANG==='tw'?' 舌暗-血瘀':' 舌暗-血瘀');
      if(t.indexOf('\u9EC4')>=0)tongueAnalysis+=(LANG==='en'?' Yellow Coating-Internal Heat':LANG==='tw'?' 苔黃-裡熱':' 苔黄-里热');
      if(t.indexOf('\u767D')>=0)tongueAnalysis+=(LANG==='en'?' White Coating-Cold Damp':LANG==='tw'?' 苔白-寒濕':' 苔白-寒湿');
      if(t.indexOf('\u539A')>=0)tongueAnalysis+=(LANG==='en'?' Thick Coating-Phlegm/Food Stagnation':LANG==='tw'?' 厚苔-痰濕食積':' 厚苔-痰湿食积');
      if(t.indexOf('\u8584')>=0)tongueAnalysis+=(LANG==='en'?' Thin Coating-Qi Deficiency':LANG==='tw'?' 薄苔-氣虛':' 薄苔-气虚');

      if(t.indexOf('\u88C2\u7EB9')>=0)tongueAnalysis+=(LANG==='en'?' Cracked Tongue-Yin Fluid Loss':LANG==='tw'?' 裂紋舌-陰液虧損':' 裂纹舌-阴液亏损');
      if(t.indexOf('\u9F7F\u75D5')>=0)tongueAnalysis+=(LANG==='en'?' Teeth Marks-Spleen Deficiency':LANG==='tw'?' 齒痕-脾虛濕盛':' 齿痕-脾虚湿盛');
      if(t.indexOf('\u80D6\u5927')>=0)tongueAnalysis+=(LANG==='en'?' Enlarged Tongue-Spleen/Kidney Yang Deficiency':LANG==='tw'?' 胖大舌-脾腎陽虛':' 胖大舌-脾肾阳虚');
      if(t.indexOf('\u7626\u5C0F')>=0)tongueAnalysis+=(LANG==='en'?' Thin Tongue-Qi/Blood Insufficiency':LANG==='tw'?' 瘦小舌-氣血不足':' 瘦小舌-气血不足');
      if(!tongueAnalysis)tongueAnalysis=' '+inp.tongue;
    }
    var pulseAnalysis='';
    if(inp.pulse){
      var p=inp.pulse;
      if(p.indexOf('\u5F26')>=0)pulseAnalysis+=(LANG==='en'?' Wiry Pulse-Liver Stagnation/Pain':LANG==='tw'?' 弦脈-肝鬱/疼痛':' 弦脉-肝郁/疼痛');

      if(p.indexOf('\u6D2A')>=0)pulseAnalysis+=(LANG==='en'?' Flooding Pulse-Excess Heat':LANG==='tw'?' 洪脈-實熱':' 洪脉-实热');
      if(!pulseAnalysis)pulseAnalysis=' '+p;
    }
    return{
      ok:true,sy:sy,sm:sm,sd:sd,ct:inp.ct,il:inp.il,zc:zc,sx:shengxiao,gender:inp.gn,
      lunarYear:lunarYearNum,lunarYearGanzhi:lunarYearGanzhi,lunarDisplay:lunarDisplay,
      by:by,bm:bm,bd:bd,bh:bh,bYun:bYun,bLq:bLq,bwc:bwc,

    };
  }catch(e){return{ok:false,err:e.message};}
}

function go(){
  try{
    var y=parseInt(document.getElementById('iY').value);
    var m=parseInt(document.getElementById('iM').value);
    var d=parseInt(document.getElementById('iD').value);
    var hs=document.getElementById('iH').value.trim();
    var hr=null;
    if(hs!==''){var parts=hs.split(':');if(parts.length===2){hr=parseInt(parts[0])+parseInt(parts[1])/60;}else{hr=parseInt(hs);}}
    var gn=document.getElementById('iG').value;
    var si=document.getElementById('iS').value;
    var ctEl=document.querySelector('input[name=ct]:checked');
    var ct=ctEl?ctEl.value:'solar';
    var lpEl=document.getElementById('iL');
    var il=lpEl?(lpEl.value==='1'):false;
    var tongue=document.getElementById('iTongue').value.trim();
    var pulse=document.getElementById('iPulse').value.trim();
    var symptom=document.getElementById('symptom').value.trim();
    if(!y||!m||!d||y<1900||y>2099){alert(LANG==='en'?'Please enter a valid year (1900-2099)':LANG==='tw'?'請輸入有效年份(1900-2099)':'请输入有效年份(1900-2099)');return;}
    var cd=document.getElementById('iCD').value;
    var ctime=document.getElementById('iCT').value;
    var ccy,ccm,ccd,cminute=0;
    if(cd){var cparts=cd.split('-');ccy=parseInt(cparts[0])||2026;ccm=parseInt(cparts[1])||1;ccd=parseInt(cparts[2])||1;}
    else{var _cn=new Date();ccy=_cn.getFullYear();ccm=_cn.getMonth()+1;ccd=_cn.getDate();}
    if(isNaN(ccy))ccy=2026;if(isNaN(ccm))ccm=1;if(isNaN(ccd))ccd=1;
    if(ctime){var tparts=ctime.split(':');cminute=(parseInt(tparts[0])||0)+((parseInt(tparts[1])||0)/60);}
    document.getElementById('inputForm').style.display='none';
    document.getElementById('loading').style.display='block';
    document.getElementById('report').style.display='none';
    setTimeout(function(){
      try{
        var inp={y:y,m:m,d:d,hr:hr,gn:gn,si:si,ct:ct,il:il,cy:ccy,cm:ccm,cd:ccd,cminute:cminute,tongue:tongue,pulse:pulse,symptom:symptom};
        try{localStorage.setItem('lastInput',JSON.stringify({y:y,m:m,d:d,hs:hs,gn:gn,si:si,ct:ct,il:il,tongue:tongue,pulse:pulse,symptom:symptom}));}catch(e){}
        var a=analyze(inp);
        lastResult=a;lastInput=inp;
        document.getElementById('loading').style.display='none';
        if(a&&a.ok){
          document.getElementById('report').innerHTML=R(a,inp);
        }else{
          document.getElementById('report').innerHTML='<div class="sec"><p class="it ib">'+t('analyzing')+' '+(LANG==='en'?'failed':LANG==='tw'?'失敗':'失败')+': '+esc(a.err||t('unknown'))+'</p></div>';
        }
        document.getElementById('report').style.display='block';
        window.scrollTo({top:0,behavior:'smooth'});
      }catch(e){
        document.getElementById('loading').style.display='none';
        document.getElementById('report').innerHTML='<div class="eb">'+esc(e.message)+'</div>';
        document.getElementById('report').style.display='block';
      }
    },600);
  }catch(e){alert((LANG==='en'?'Error: ':LANG==='tw'?'錯誤: ':'错误: ') + e.message);}
}

var radios=document.querySelectorAll('input[name=ct]');
for(var i=0;i<radios.length;i++){
  radios[i].addEventListener('change',function(){
    document.getElementById('lpR').style.display=(this.value==='lunar')?'grid':'none';
  });
}

document.addEventListener('DOMContentLoaded',function(){
  try{
    var saved=localStorage.getItem('lastInput');
    if(saved){
      var s=JSON.parse(saved);
      var el;
      el=document.getElementById('iY');if(el&&s.y)el.value=s.y;
      el=document.getElementById('iM');if(el&&s.m)el.value=s.m;
      el=document.getElementById('iD');if(el&&s.d)el.value=s.d;
      el=document.getElementById('iH');if(el&&s.hs)el.value=s.hs;
      el=document.getElementById('iG');if(el&&s.gn)el.value=s.gn;
      el=document.getElementById('iS');if(el&&s.si!==undefined)el.value=s.si;
      if(s.ct){
        var rds=document.querySelectorAll('input[name=ct]');
        rds.forEach(function(r){r.checked=(r.value===s.ct);});
        var lpR=document.getElementById('lpR');
        if(lpR)lpR.style.display=(s.ct==='lunar')?'grid':'none';
        if(s.il){el=document.getElementById('iL');if(el)el.value='1';}
      }
      el=document.getElementById('iTongue');if(el&&s.tongue)el.value=s.tongue;
      el=document.getElementById('iPulse');if(el&&s.pulse)el.value=s.pulse;
      el=document.getElementById('symptom');if(el&&s.symptom)el.value=s.symptom;
    }
  }catch(e){}

  var now=new Date();
  var iCD=document.getElementById('iCD');
  if(iCD&&!iCD.value){
    var mm=String(now.getMonth()+1).padStart(2,'0');
    var dd=String(now.getDate()).padStart(2,'0');
    iCD.value=now.getFullYear()+'-'+mm+'-'+dd;
  }
  var iCT=document.getElementById('iCT');
  if(iCT&&!iCT.value){
    var hh=String(now.getHours()).padStart(2,'0');
    var mi=String(now.getMinutes()).padStart(2,'0');
    iCT.value=hh+':'+mi;
  }
  if(typeof Lunar==='undefined'){
    var el=document.getElementById('algInfo');
    el.style.display='block';
    el.innerHTML=LANG==='en'?'⚠️ Lunar calendar engine not loaded, please check network connection':LANG==='tw'?'⚠️ 萬年曆引擎未加載，請檢查網絡連接':'⚠️ 万年历引擎未加载，请检查网络连接';
  }
  updateUI();
  // Add event listeners for language buttons
  var langBtns = document.querySelectorAll('.lang-btn');
  langBtns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      console.log('Button clicked:', this.id);
      var lang = this.id === 'langZh' ? 'zh' : this.id === 'langTw' ? 'tw' : 'en';
      console.log('Switching to language:', lang);
      setLang(lang);
    });
  });
  console.log('Language buttons initialized:', langBtns.length);
});
</script>
